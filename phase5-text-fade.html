<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第五阶段 · 文字淡入</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d1a; color: #e0d8c8;
    font-family: 'Songti SC', 'Noto Serif CJK SC', serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 40px 20px;
  }
  h1 { font-size: 16px; font-weight: normal; color: #a0a0b0; margin-bottom: 16px; letter-spacing: 0.15em; }
  canvas { border: 1px solid #333350; border-radius: 4px; margin-bottom: 16px; }
  .controls { display: flex; align-items: center; gap: 12px; color: #8888a0; font-size: 14px; }
  input[type=range] { width: 240px; accent-color: #c0a060; }
  #val { color: #c0a060; min-width: 40px; }
</style>
</head>
<body>

<h1>拖滑块控制动画进度 · 逐行淡入</h1>
<canvas id="c" width="600" height="450"></canvas>
<div class="controls">
  <span>进度</span>
  <input type="range" id="slider" min="0" max="100" value="0" step="1">
  <span id="val">0%</span>
</div>

<script type="module">
import { prepareWithSegments, layoutWithLines }
  from 'https://esm.sh/@chenglou/pretext@0.0.6';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('slider');
const valLabel = document.getElementById('val');

// 诗
const TEXT = '春江潮水连海平，海上明月共潮生。'
  + '滟滟随波千万里，何处春江无月明。'
  + '江流宛转绕芳甸，月照花林皆似霰。'
  + '空里流霜不觉飞，汀上白沙看不见。'
  + '江天一色无纤尘，皎皎空中孤月轮。'
  + '江畔何人初见月，江月何年初照人。';

const FONT = '20px "Songti SC", "Noto Serif CJK SC", serif';
const LINE_H = 36;
const CONTAINER_W = 500;       // 容器宽度
const START_X = 50;             // 文字起始 x
const START_Y = 60;             // 第一行 y

// ===== 预处理：Pretext 分行（只做一次）=====
const prepared = prepareWithSegments(TEXT, FONT);
const { lines } = layoutWithLines(prepared, CONTAINER_W, LINE_H);

console.log('共', lines.length, '行');

// ============================================================
// TODO：根据进度值（0~100）画文字
// ============================================================
//
// 需求：
//   进度 = 0   → 所有文字透明（看不见）
//   进度 = 100 → 所有文字完全不透明
//   中间状态  → 上面几行先出现，下面几行后出现（阶梯延迟）
//
// 你需要写：
//   1. 清空 canvas
//   2. 算出总共有多少行（lines.length）
//   3. 根据进度值（0~100），换算出一个「显示到第几行」
//      提示：显示的半行数 = (进度 / 100) * 行数 * 1.5
//      乘 1.5 是为了最后几行也能完全显示
//   4. 遍历每一行，算出这行当前的透明度：
//      - 如果「已显示行数」> 当前行号 + 0.3 → 完全显示（opacity = 1）
//      - 如果「已显示行数」在 当前行号 ~ 当前行号+0.3 之间 → 正在淡入
//      - 否则 → 透明（opacity = 0）
//   5. 用 ctx.globalAlpha = opacity 控制透明度
//   6. 用 ctx.fillText 画文字
//
// ============================================================

function redraw(progress) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 设置字体和文字颜色
  ctx.font = FONT;
  ctx.fillStyle = '#e0d8c8';
  ctx.textBaseline = 'top';

  // 👇 在这里写你的代码 👇
  // 提示：
  //   const totalLines = lines.length;
  //   const visibleLines = (progress / 100) * totalLines * 1.5;
  //   for (let i = 0; i < totalLines; i++) { ... }
  // 获取总行数
  const totalLines = lines.length;
  // 根据进度计算"可见行数"，乘以 1.5 是为了让最后几行也能完全显示
  const visibleLines = (progress / 100) * totalLines * 1.5;
  // 遍历每一行
  for(let i = 0; i < totalLines; i++){
    // 淡入范围：控制淡入过渡的平滑度（0.3 表示过渡区域占 0.3 行）
    const fadeRange = 0.3;
    // 当前行相对于"可见行数"的进度：正值表示已到达或超过该行，负值表示还未到达
    const lineProgress = visibleLines - i;
    let opacity;
    // 如果进度超过淡入范围，完全不透明
    if (lineProgress > fadeRange) opacity = 1;
    // 如果进度在淡入范围内，计算部分透明度（线性插值）
    else if (lineProgress > 0) opacity = lineProgress / fadeRange;
    // 否则完全透明
    else opacity = 0;
    // 设置当前绘制的透明度
    ctx.globalAlpha = opacity;
    // 画文字（x 固定，y 按行高递增）
    ctx.fillText(lines[i].text,START_X,START_Y + i * LINE_H);
  }
  // 恢复全局透明度为 1，不影响后续绘制


  // 👆 在这里写你的代码 👆
}

// 初始状态（进度 = 0）
redraw(0);

// 滑块控制
slider.addEventListener('input', () => {
  const v = parseInt(slider.value);
  valLabel.textContent = v + '%';
  redraw(v);
});
</script>
</body>
</html>
