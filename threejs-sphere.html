<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Sphere · three.js</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #050510; }
    canvas { display: block; }
    #info {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.2); font: 13px/1.4 'Helvetica Neue', sans-serif;
      text-align: center; pointer-events: none; user-select: none;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
<div id="info">拖曳旋轉 · 滾輪縮放</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ═══════════════════════════════════════════════════════
//  SCENE SETUP
// ═══════════════════════════════════════════════════════

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
document.body.appendChild(renderer.domElement);

// ── Controls ──
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.5;
controls.minDistance = 2.5;
controls.maxDistance = 12;

// ═══════════════════════════════════════════════════════
//  POST-PROCESSING — bloom glow
// ═══════════════════════════════════════════════════════

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.6,   // strength
  0.2,   // radius
  0.1    // threshold
);
composer.addPass(bloomPass);

// ═══════════════════════════════════════════════════════
//  LIGHTS
// ═══════════════════════════════════════════════════════

const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
scene.add(ambientLight);

const mainLight = new THREE.DirectionalLight(0x4488ff, 3);
mainLight.position.set(2, 3, 4);
scene.add(mainLight);

const fillLight = new THREE.DirectionalLight(0xff44aa, 1.5);
fillLight.position.set(-3, -1, 2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x00ffcc, 1);
rimLight.position.set(-1, 3, -3);
scene.add(rimLight);

// ═══════════════════════════════════════════════════════
//  THE SPHERE — layered translucent glass
// ═══════════════════════════════════════════════════════

const sphereGroup = new THREE.Group();

// Inner core — solid, glowing
const coreGeo = new THREE.SphereGeometry(0.9, 64, 64);
const coreMat = new THREE.MeshPhysicalMaterial({
  color: 0x4a7aff,
  emissive: 0x1a3aff,
  emissiveIntensity: 0.3,
  metalness: 0.2,
  roughness: 0.1,
  envMapIntensity: 0.5,
});
const core = new THREE.Mesh(coreGeo, coreMat);
sphereGroup.add(core);

// Middle layer — glassy, iridescent
const midGeo = new THREE.SphereGeometry(1.05, 64, 64);
const midMat = new THREE.MeshPhysicalMaterial({
  color: 0x88ccff,
  emissive: 0x3366ff,
  emissiveIntensity: 0.05,
  metalness: 0.1,
  roughness: 0.05,
  transparent: true,
  opacity: 0.3,
  clearcoat: 0.8,
  clearcoatRoughness: 0.2,
  envMapIntensity: 1.5,
});
const mid = new THREE.Mesh(midGeo, midMat);
sphereGroup.add(mid);

// Outer shell — wireframe wisps
const outerGeo = new THREE.SphereGeometry(1.2, 32, 24);
const outerMat = new THREE.MeshPhysicalMaterial({
  color: 0x88ddff,
  emissive: 0x4488ff,
  emissiveIntensity: 0.1,
  wireframe: true,
  transparent: true,
  opacity: 0.15,
});
const outer = new THREE.Mesh(outerGeo, outerMat);
sphereGroup.add(outer);

scene.add(sphereGroup);

// ═══════════════════════════════════════════════════════
//  ORBITING RING
// ═══════════════════════════════════════════════════════

const ringPoints = [];
const ringSegments = 120;
for (let i = 0; i <= ringSegments; i++) {
  const theta = (i / ringSegments) * Math.PI * 2;
  const radius = 1.8;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  // Slight tilt
  const y = Math.sin(theta * 2) * 0.15;
  ringPoints.push(new THREE.Vector3(x, y, z));
}
const ringGeo = new THREE.BufferGeometry().setFromPoints(ringPoints);
const ringMat = new THREE.LineBasicMaterial({
  color: 0x4488ff,
  transparent: true,
  opacity: 0.4,
});
const ring = new THREE.Line(ringGeo, ringMat);
sphereGroup.add(ring);

// Second ring — perpendicular
const ringPoints2 = [];
for (let i = 0; i <= ringSegments; i++) {
  const theta = (i / ringSegments) * Math.PI * 2;
  const radius = 2.0;
  const x = Math.cos(theta) * radius * 0.7;
  const y = Math.sin(theta) * radius;
  const z = Math.cos(theta * 1.5) * radius * 0.3;
  ringPoints2.push(new THREE.Vector3(x, y, z));
}
const ringGeo2 = new THREE.BufferGeometry().setFromPoints(ringPoints2);
const ringMat2 = new THREE.LineBasicMaterial({
  color: 0xff66aa,
  transparent: true,
  opacity: 0.25,
});
const ring2 = new THREE.Line(ringGeo2, ringMat2);
sphereGroup.add(ring2);

// ═══════════════════════════════════════════════════════
//  ORBITING PARTICLES
// ═══════════════════════════════════════════════════════

const particleCount = 300;
const particlePositions = new Float32Array(particleCount * 3);
const particleSizes = new Float32Array(particleCount);
const particleSpeeds = new Float32Array(particleCount);
const particleOffsets = new Float32Array(particleCount);
const particleRadii = new Float32Array(particleCount);

for (let i = 0; i < particleCount; i++) {
  const radius = 1.5 + Math.random() * 2.5;
  const angle = Math.random() * Math.PI * 2;
  const height = (Math.random() - 0.5) * 0.8;

  particlePositions[i * 3] = Math.cos(angle) * radius;
  particlePositions[i * 3 + 1] = height;
  particlePositions[i * 3 + 2] = Math.sin(angle) * radius;
  particleSizes[i] = 0.02 + Math.random() * 0.06;
  particleSpeeds[i] = 0.3 + Math.random() * 0.7;
  particleOffsets[i] = angle;
  particleRadii[i] = radius;
}

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeo.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

const particleMat = new THREE.PointsMaterial({
  color: 0x88ccff,
  size: 0.04,
  transparent: true,
  opacity: 0.7,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const particleSystem = new THREE.Points(particleGeo, particleMat);
sphereGroup.add(particleSystem);

// Store for animation
const particleData = { positions: particlePositions, radii: particleRadii,
  speeds: particleSpeeds, offsets: particleOffsets, count: particleCount };

// ═══════════════════════════════════════════════════════
//  STARFIELD
// ═══════════════════════════════════════════════════════

const starCount = 2000;
const starPositions = new Float32Array(starCount * 3);
const starColors = new Float32Array(starCount * 3);
const starSizes = new Float32Array(starCount);

for (let i = 0; i < starCount; i++) {
  const radius = 30 + Math.random() * 70;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);

  starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
  starPositions[i * 3 + 1] = radius * Math.cos(phi);
  starPositions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);

  const warmth = Math.random();
  starColors[i * 3] = lerp(0.7, 1, warmth);
  starColors[i * 3 + 1] = lerp(0.8, 0.97, warmth);
  starColors[i * 3 + 2] = lerp(1, 0.9, warmth);

  starSizes[i] = 0.05 + Math.random() * 0.2;
}

const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

const starMat = new THREE.PointsMaterial({
  size: 0.15,
  vertexColors: true,
  transparent: true,
  opacity: 0.8,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true,
});
const starField = new THREE.Points(starGeo, starMat);
scene.add(starField);

function lerp(a, b, t) { return a + (b - a) * t; }

// ═══════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════

const clock = new THREE.Clock();

function animate() {
  const elapsed = clock.getElapsedTime();

  // Sphere slow pulse
  const pulse = 1 + Math.sin(elapsed * 0.5) * 0.02;
  sphereGroup.scale.set(pulse, pulse, pulse);

  // Core emissive pulse
  coreMat.emissiveIntensity = 0.3 + Math.sin(elapsed * 0.8) * 0.15;

  // Ring rotation
  ring.rotation.x = Math.sin(elapsed * 0.2) * 0.1;
  ring.rotation.z = elapsed * 0.15;
  ring2.rotation.x = elapsed * 0.1;
  ring2.rotation.y = Math.sin(elapsed * 0.15) * 0.2;

  // Orbit particles
  const pos = particleData.positions;
  for (let i = 0; i < particleData.count; i++) {
    const angle = particleData.offsets[i] + elapsed * particleData.speeds[i] * 0.15;
    const radius = particleData.radii[i];
    pos[i * 3] = Math.cos(angle) * radius;
    pos[i * 3 + 1] = Math.sin(elapsed * particleData.speeds[i] * 0.3 + i) * 0.3;
    pos[i * 3 + 2] = Math.sin(angle) * radius;
  }
  particleSystem.geometry.attributes.position.needsUpdate = true;

  // Star twinkle (via opacity)
  starMat.opacity = 0.7 + Math.sin(elapsed * 0.3) * 0.15;

  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}

animate();

// ═══════════════════════════════════════════════════════
//  RESIZE
// ═══════════════════════════════════════════════════════

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
