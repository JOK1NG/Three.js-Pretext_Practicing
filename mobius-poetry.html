<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莫比乌斯诗带 — Möbius Poetry</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; overflow: hidden; font-family: 'Songti SC', 'Noto Serif CJK SC', serif; }
  canvas { display: block; }
  #hint {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    color: rgba(212,168,83,0.7); font-size: 14px; letter-spacing: 0.15em;
    pointer-events: none; z-index: 10; transition: opacity 2s;
  }
  #title {
    position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
    color: rgba(212,168,83,0.9); font-size: 22px; letter-spacing: 0.3em;
    pointer-events: none; z-index: 10; text-shadow: 0 0 30px rgba(212,168,83,0.4);
  }
</style>
</head>
<body>
<div id="title">莫 比 乌 斯 诗 带</div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 诗句环绕无尽</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// === POEM: 李白《将进酒》 ===
const poem = `君不见黄河之水天上来奔流到海不复回君不见高堂明镜悲白发朝如青丝暮成雪人生得意须尽欢莫使金樽空对月天生我材必有用千金散尽还复来烹羊宰牛且为乐会须一饮三百杯岑夫子丹丘生将进酒杯莫停与君歌一曲请君为我倾耳听钟鼓馔玉不足贵但愿长醉不愿醒古来圣贤皆寂寞惟有饮者留其名陈王昔时宴平乐斗酒十千恣欢谑主人何为言少钱径须沽取对君酌五花马千金裘呼儿将出换美酒与尔同销万古愁`;
const chars = [...poem];

// === SCENE ===
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2('#050510', 0.00008);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 100);
camera.position.set(4, 6, 12);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// === POST-PROCESSING ===
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.4, 0.2
);
bloomPass.threshold = 0.1;
bloomPass.strength = 1.2;
bloomPass.radius = 0.8;
composer.addPass(bloomPass);

// === CONTROLS ===
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.minDistance = 5;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.75;
controls.update();

// === LIGHTING ===
scene.add(new THREE.AmbientLight('#2a2040', 0.6));
const keyLight = new THREE.PointLight('#ffd8a0', 80, 30, 1.5);
keyLight.position.set(8, 6, 8);
scene.add(keyLight);
const rimLight = new THREE.PointLight('#8090ff', 40, 25, 2);
rimLight.position.set(-6, -2, -6);
scene.add(rimLight);
const fillLight = new THREE.PointLight('#ff9060', 30, 20, 2);
fillLight.position.set(0, 4, -8);
scene.add(fillLight);

// === STARFIELD ===
const starsGeo = new THREE.BufferGeometry();
const starCount = 2500;
const starPositions = new Float32Array(starCount * 3);
const starSizes = new Float32Array(starCount);
for (let i = 0; i < starCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 30 + Math.random() * 40;
  starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  starPositions[i * 3 + 2] = r * Math.cos(phi);
  starSizes[i] = Math.random() * 2.5 + 0.3;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
starsGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
const starsMat = new THREE.PointsMaterial({
  color: '#c8d0ff',
  size: 0.06,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true,
  opacity: 0.8,
});
const stars = new THREE.Points(starsGeo, starsMat);
scene.add(stars);

// === MÖBIUS STRIP SURFACE ===
const R = 4.5;        // major radius
const halfW = 1.1;    // half-width
const uSegs = 240;
const vSegs = 24;

const stripGeo = new THREE.BufferGeometry();
const positions = [];
const normals = [];
const indices = [];

for (let i = 0; i <= uSegs; i++) {
  const u = (i / uSegs) * Math.PI * 2;
  const cu = Math.cos(u);
  const su = Math.sin(u);
  const cu2 = Math.cos(u / 2);
  const su2 = Math.sin(u / 2);

  for (let j = 0; j <= vSegs; j++) {
    const v = (j / vSegs) * 2 * halfW - halfW;
    const Rv = R + v * cu2;
    positions.push(Rv * cu, Rv * su, v * su2);

    // Surface normal (unnormalized)
    const nx = -su * (R + v * cu2) * su2 + cu * v * cu2 / 2 - su * v * su2 * cu2;
    const ny =  cu * (R + v * cu2) * su2 + su * v * cu2 / 2 + cu * v * su2 * su2;
    const nz = -R * cu2 - v;
    const nl = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
    normals.push(nx / nl, ny / nl, nz / nl);
  }
}

for (let i = 0; i < uSegs; i++) {
  for (let j = 0; j < vSegs; j++) {
    const a = i * (vSegs + 1) + j;
    const b = a + vSegs + 1;
    indices.push(a, b, a + 1);
    indices.push(a + 1, b, b + 1);
  }
}

stripGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
stripGeo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
stripGeo.setIndex(indices);
stripGeo.computeTangents();

const stripMat = new THREE.MeshPhysicalMaterial({
  color: '#c89840',
  metalness: 0.3,
  roughness: 0.35,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.55,
  envMapIntensity: 0,
  clearcoat: 0.1,
  clearcoatRoughness: 0.4,
});
const strip = new THREE.Mesh(stripGeo, stripMat);
scene.add(strip);

// === EDGE LINES (both boundaries) ===
function createEdgeLine(vOffset) {
  const pts = [];
  const n = 360;
  for (let i = 0; i <= n; i++) {
    const u = (i / n) * Math.PI * 2;
    const x = (R + vOffset * Math.cos(u / 2)) * Math.cos(u);
    const y = (R + vOffset * Math.cos(u / 2)) * Math.sin(u);
    const z = vOffset * Math.sin(u / 2);
    pts.push(new THREE.Vector3(x, y, z));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({
    color: '#ffd080',
    transparent: true,
    opacity: 0.55,
    linewidth: 1,
  });
  return new THREE.Line(geo, mat);
}
const edge1 = createEdgeLine(halfW);
const edge2 = createEdgeLine(-halfW);
scene.add(edge1);
scene.add(edge2);

// === TEXT SPRITES ALONG THE STRIP ===
const textGroup = new THREE.Group();
const vText = halfW * 0.55; // text floats a bit above surface

for (let i = 0; i < chars.length; i++) {
  const u = (i / chars.length) * Math.PI * 4; // two full wraps (0 to 4π)

  // Position on the surface
  const cu = Math.cos(u);
  const su = Math.sin(u);
  const cu2 = Math.cos(u / 2);
  const su2 = Math.sin(u / 2);
  const Rv = R + vText * cu2;
  const px = Rv * cu;
  const py = Rv * su;
  const pz = vText * su2;

  // Create canvas sprite
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffe8c0';
  ctx.font = 'bold 36px "Songti SC", "Noto Serif CJK SC", "STSong", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(255,200,100,0.6)';
  ctx.shadowBlur = 8;
  ctx.fillText(chars[i], 32, 32);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.colorSpace = THREE.SRGBColorSpace;

  const spriteMat = new THREE.SpriteMaterial({
    map: texture,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.9,
  });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.position.set(px, py, pz);
  sprite.scale.set(0.42, 0.42, 1);
  textGroup.add(sprite);
}
scene.add(textGroup);

// === FLOATING ORBITAL PARTICLES ===
const orbitGroup = new THREE.Group();
const orbitCount = 200;
const orbitGeo = new THREE.BufferGeometry();
const orbitPositions = new Float32Array(orbitCount * 3);
const orbitColors = new Float32Array(orbitCount * 3);

for (let i = 0; i < orbitCount; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = R + halfW + 0.5 + Math.random() * 2.5;
  const height = (Math.random() - 0.5) * 4;
  orbitPositions[i * 3] = Math.cos(angle) * radius;
  orbitPositions[i * 3 + 1] = height;
  orbitPositions[i * 3 + 2] = Math.sin(angle) * radius;

  const hue = 0.1 + Math.random() * 0.1;
  const c = new THREE.Color().setHSL(hue, 0.8, 0.5 + Math.random() * 0.4);
  orbitColors[i * 3] = c.r;
  orbitColors[i * 3 + 1] = c.g;
  orbitColors[i * 3 + 2] = c.b;
}
orbitGeo.setAttribute('position', new THREE.BufferAttribute(orbitPositions, 3));
orbitGeo.setAttribute('color', new THREE.BufferAttribute(orbitColors, 3));
const orbitMat = new THREE.PointsMaterial({
  size: 0.04,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  vertexColors: true,
  transparent: true,
  opacity: 0.7,
});
const orbitParticles = new THREE.Points(orbitGeo, orbitMat);
orbitGroup.add(orbitParticles);
scene.add(orbitGroup);

// === ANIMATION LOOP ===
const clock = new THREE.Clock();
let time = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);
  time += dt;
  controls.update();

  // Gentle pulsing of strip opacity
  strip.material.opacity = 0.45 + Math.sin(time * 0.6) * 0.1;

  // Orbit particles gentle rotation
  orbitGroup.rotation.y += dt * 0.08;
  orbitGroup.rotation.x += dt * 0.03;

  // Stars subtle rotation
  stars.rotation.y += dt * 0.015;
  stars.rotation.x += dt * 0.005;

  // Edge glow pulse
  const edgeGlow = 0.45 + Math.sin(time * 0.7) * 0.15;
  edge1.material.opacity = edgeGlow;
  edge2.material.opacity = edgeGlow;

  // Light subtle movement
  keyLight.intensity = 70 + Math.sin(time * 0.5) * 15;

  composer.render();
}

// === RESIZE ===
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// === FADE HINT ===
setTimeout(() => {
  const hint = document.getElementById('hint');
  if (hint) hint.style.opacity = '0';
}, 12000);

// === START ===
animate();
</script>
</body>
</html>
