<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第七阶段 · 旋转文字画廊练习</title>
</head>
<style>
    * { margin: 0; padding: 0; }
    body { background: #0d0d1a; overflow: hidden; }
    canvas { display: block; }
</style>
<body>
    
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { prepareWithSegments, layoutWithLines } from 'https://esm.sh/@chenglou/pretext@0.0.6';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
// 场景
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d0d1a');
// 相机
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 1);
camera.lookAt(0, 0, 0);
// 渲染器
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
// 控制
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.update();
//诗句和Canvas
//诗句初始化
const TEXT1 = '春江潮水连海平，海上明月共潮生。'
  + '滟滟随波千万里，何处春江无月明。'
  + '江流宛转绕芳甸，月照花林皆似霰。'
  + '空里流霜不觉飞，汀上白沙看不见。';
const TEXT2 = '江天一色无纤尘，皎皎空中孤月轮。'
  + '江畔何人初见月？江月何年初照人？'
  + '人生代代无穷已，江月年年只相似。'
  + '不知江月待何人，但见长江送流水。';
const TEXT3 = '白云一片去悠悠，青枫浦上不胜愁。'
  + '谁家今夜扁舟子？何处相思明月楼？'
  + '可怜楼上月徘徊，应照离人妆镜台。'
  + '玉户帘中卷不去，捣衣砧上拂还来。';
const TEXT4 = '此时相望不相闻，愿逐月华流照君。'
  + '鸿雁长飞光不度，鱼龙潜跃水成文。'
  + '昨夜闲潭梦落花，可怜春半不还家。'
  + '江水流春去欲尽，江潭落月复西斜。';
const TEXTS = [TEXT1, TEXT2, TEXT3, TEXT4];
const FONT = '20px "Hack Nerd Font Mono", monospace';
const TEXT_W = 420;
const LINE_H = 34;
//诗句转换为Canvas纹理
function makeTextTexture(text) {
  // 1. Pretext 分行
const prepared = prepareWithSegments(text, FONT);
const { lines } = layoutWithLines(prepared, TEXT_W, LINE_H);
  // 2. 创建 Canvas（512×512 或其他尺寸）
const canvas = document.createElement('canvas');
canvas.width = 512;
canvas.height = 512;
const ctx = canvas.getContext('2d');
  // 3. 画背景、边框
ctx.fillStyle = '#1a1a2e';
ctx.fillRect(0, 0, 512, 512);
ctx.strokeStyle = '#4a4a6a';
ctx.lineWidth = 4;
ctx.strokeRect(10, 10, 492, 492);

  // 4. 遍历 lines 画文字
ctx.fillStyle = '#e0e0ff';
ctx.font = FONT;
ctx.textBaseline = 'top';
let y = 40;
for (const line of lines) {
  ctx.fillText(line.text, 30, y);
  y += LINE_H;
}
  // 5. 返回 new THREE.CanvasTexture(canvas)
return new THREE.CanvasTexture(canvas);
}
const textTextures = TEXTS.map(makeTextTexture);

// 灯光
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
scene.add(directionalLight);
//创建四面墙
const wallW = 3;//墙的宽度
const wallH = 3;//墙的高度
const wallD = 1.5;//墙到中心的距离
const walls = [
    { position: { x: 0, y: 0, z: wallD }, rotation: 0}, // 前
    { position: { x: 0, y: 0, z: -wallD }, rotation: Math.PI}, // 后
    { position: { x: wallD, y: 0, z: 0 }, rotation: -Math.PI/2}, // 右
    { position: { x: -wallD, y: 0, z: 0 }, rotation: Math.PI/2} // 左
];
walls.forEach((wall, index) => {
    const wallGeometry = new THREE.BoxGeometry(wallW, wallH, 0.1);
    const wallMaterial = new THREE.MeshBasicMaterial({ map: textTextures[index],side: THREE.DoubleSide });
    const wallMesh = new THREE.Mesh(wallGeometry, wallMaterial);
    wallMesh.position.set(wall.position.x, wall.position.y, wall.position.z);
    wallMesh.rotation.y = wall.rotation;
    scene.add(wallMesh);
});
//创建后期处理
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight));
bloomPass.threshold = 0.2;
bloomPass.strength = 0.4;
bloomPass.radius = 0.1;
composer.addPass(bloomPass);
// 渲染循环
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  composer.render();

}
animate();
</script>
</body>
</html>
