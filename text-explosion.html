<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文字粒子爆炸 · Text Particles</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #050508; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #info {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(232,213,183,0.25); font-size: 13px; text-align: center;
      pointer-events: none; letter-spacing: 0.5px; z-index: 2;
    }
    #hint {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: rgba(232,213,183,0.1); font-size: 16px; letter-spacing: 6px;
      pointer-events: none; transition: opacity 1s; z-index: 2;
      font-family: "Songti SC", serif;
    }
    #hint.fade { opacity: 0; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: rgba(232,213,183,0.35); font-size: 14px; letter-spacing: 4px;
      background: #050508; z-index: 10; transition: opacity 0.8s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
<div id="loading">✦ 點 亮 星 辰 ✦</div>
<div id="hint">✦ 點擊引爆 ✦</div>
<div id="info">🖱 點擊爆炸 · 拖曳旋轉 · 按 <kbd style="background:rgba(255,255,255,0.06);padding:0 5px;border-radius:2px">s</kbd> 截圖</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { prepareWithSegments, walkLineRanges, materializeLineRange } from 'https://esm.sh/@chenglou/pretext@0.0.6';

// ═══════════════════════════════════════════════════════
//  TEXT — poems about reaching for the stars
// ═══════════════════════════════════════════════════════

const TEXT = [
  '夜宿山寺  李白',
  '危樓高百尺，手可摘星辰。',
  '不敢高聲語，恐驚天上人。',
  '',
  '登鸛雀樓  王之渙',
  '白日依山盡，黃河入海流。',
  '欲窮千里目，更上一層樓。',
].join('\n');

// ═══════════════════════════════════════════════════════
//  FONT & LAYOUT CONSTANTS
// ═══════════════════════════════════════════════════════

const FONT = '28px "Georgia", "Songti SC", "Noto Serif CJK SC", "SimSun", serif';
const LINE_H = 50;
const COL_W = 550;
const CHAR_CANVAS_SIZE = 80;

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════

let scene, camera, renderer, controls, composer;
let charParticles = [];
let spriteGroup;
let clock = new THREE.Clock();
let starField;
let isExploded = false;
let lastAutoExplode = 0;
let autoExplodeInterval = 7; // seconds
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();

// ═══════════════════════════════════════════════════════
//  BUILD CHARACTER SPRITES
// ═══════════════════════════════════════════════════════

function createCharSprite(char) {
  const size = CHAR_CANVAS_SIZE;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Transparent background
  ctx.clearRect(0, 0, size, size);

  // Soft glow
  ctx.shadowColor = 'rgba(232, 213, 183, 0.4)';
  ctx.shadowBlur = 12;

  // Character
  const fontSize = char.match(/[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/) ? 38 : 26;
  ctx.fillStyle = '#e8d5b7';
  ctx.font = `500 ${fontSize}px "Georgia", "Songti SC", "Noto Serif CJK SC", serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(char, size / 2, size / 2);

  // Second pass for crisp core
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#f0e8d8';
  ctx.fillText(char, size / 2, size / 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearMipmapLinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = true;

  const material = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    opacity: 1,
  });

  const sprite = new THREE.Sprite(material);
  sprite.scale.set(0.55, 0.55, 1);

  return { sprite, canvas };
}

// ═══════════════════════════════════════════════════════
//  PRETEXT LAYOUT → CHARACTER POSITIONS
// ═══════════════════════════════════════════════════════

function layoutText() {
  const prepared = prepareWithSegments(TEXT, FONT);
  const particles = [];

  // Temp canvas for per-character measurement
  const tmp = document.createElement('canvas');
  const tctx = tmp.getContext('2d');
  tctx.font = FONT;

  let lineY = 0;
  walkLineRanges(prepared, COL_W, (line) => {
    const range = materializeLineRange(prepared, line);
    if (!range.text.trim()) {
      lineY += LINE_H;
      return;
    }

    let lineX = 0;
    const seg = new Intl.Segmenter(undefined, { granularity: 'grapheme' });

    for (const { segment } of seg.segment(range.text)) {
      if (segment.trim() === '' && segment.length === 1) {
        // Space — measure and skip
        lineX += tctx.measureText(segment).width || 8;
        continue;
      }
      const w = tctx.measureText(segment).width || 20;
      const { sprite } = createCharSprite(segment);
      particles.push({
        char: segment,
        homeX: lineX + w / 2,
        homeY: lineY,
        x: lineX + w / 2,
        y: lineY,
        z: 0,
        vx: 0, vy: 0, vz: 0,
        sprite,
        scale: sprite.scale.x,
        rotV: (Math.random() - 0.5) * 0.02,
        phase: Math.random() * Math.PI * 2,
      });
      lineX += w;
    }
    lineY += LINE_H;
  });

  return particles;
}

// ═══════════════════════════════════════════════════════
//  CENTER THE TEXT
// ═══════════════════════════════════════════════════════

function centerParticles(particles) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of particles) {
    minX = Math.min(minX, p.homeX);
    maxX = Math.max(maxX, p.homeX);
    minY = Math.min(minY, p.homeY);
    maxY = Math.max(maxY, p.homeY);
  }
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;

  for (const p of particles) {
    p.homeX = (p.homeX - cx) * 0.012;
    p.homeY = -(p.homeY - cy) * 0.012; // flip Y for 3D up
    p.x = p.homeX;
    p.y = p.homeY;
    p.z = 0;
  }
}

// ═══════════════════════════════════════════════════════
//  BUILD SCENE
// ═══════════════════════════════════════════════════════

function buildScene() {
  spriteGroup = new THREE.Group();

  for (const p of charParticles) {
    p.sprite.position.set(p.x, p.y, p.z);
    spriteGroup.add(p.sprite);
  }

  scene.add(spriteGroup);
}

// ═══════════════════════════════════════════════════════
//  STARFIELD
// ═══════════════════════════════════════════════════════

function buildStars() {
  const count = 1200;
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const r = 15 + Math.random() * 70;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi) * 0.35;
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    const w = Math.random();
    col[i * 3] = 0.6 + w * 0.4;
    col[i * 3 + 1] = 0.6 + w * 0.3;
    col[i * 3 + 2] = 0.7 + w * 0.3;
    sizes[i] = 0.04 + Math.random() * 0.2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const mat = new THREE.PointsMaterial({
    size: 0.12,
    vertexColors: true,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });

  starField = new THREE.Points(geo, mat);
  scene.add(starField);
}

// ═══════════════════════════════════════════════════════
//  EXPLOSION PHYSICS
// ═══════════════════════════════════════════════════════

function explode(originX, originY) {
  const worldOrigin = new THREE.Vector3(originX, originY, 0);
  const force = 1.8 + Math.random() * 0.6;

  for (const p of charParticles) {
    const dx = p.x - worldOrigin.x;
    const dy = p.y - worldOrigin.y;
    const dz = p.z - worldOrigin.z;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.01;

    const spread = force * (0.6 + Math.random() * 0.4);
    p.vx = (dx / dist) * spread + (Math.random() - 0.5) * 0.4;
    p.vy = (dy / dist) * spread + (Math.random() - 0.5) * 0.4;
    p.vz = (Math.random() - 0.5) * spread * 0.5;

    // Color shift on explosion — flash bright white then warm
    p.sprite.material.color.setHSL(0.08, 0.3, 0.9 + Math.random() * 0.1);
  }

  isExploded = true;
  lastAutoExplode = clock.getElapsedTime();

  // Fade hint
  document.getElementById('hint').classList.add('fade');
}

function explodeRandom() {
  // Explode from center with slight random offset
  explode(
    (Math.random() - 0.5) * 0.5,
    (Math.random() - 0.5) * 0.5
  );
}

// ═══════════════════════════════════════════════════════
//  UPDATE PHYSICS
// ═══════════════════════════════════════════════════════

function updateParticles(time, dt) {
  const returnStrength = 0.007;
  const damping = 0.93;
  const idleJitter = 0.003;

  // Bloom strength follows energy
  let totalEnergy = 0;

  for (const p of charParticles) {
    // Compute energy (how far from home + how fast)
    const dx = p.homeX - p.x;
    const dy = p.homeY - p.y;
    const dz = -p.z;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

    // Spring force toward home
    if (isExploded) {
      p.vx += dx * returnStrength;
      p.vy += dy * returnStrength;
      p.vz += dz * returnStrength;
    }

    // Damping
    p.vx *= damping;
    p.vy *= damping;
    p.vz *= damping;

    // Idle gentle float (always)
    p.vx += Math.sin(time * 0.5 + p.phase) * idleJitter;
    p.vy += Math.cos(time * 0.4 + p.phase * 1.3) * idleJitter;

    // Update position
    p.x += p.vx;
    p.y += p.vy;
    p.z += p.vz;

    // Update sprite
    p.sprite.position.set(p.x, p.y, p.z);

    // Scale based on z-depth (closer = bigger, farther = smaller)
    const zFactor = 1 + p.z * 0.08;
    p.sprite.scale.set(p.scale * zFactor, p.scale * zFactor, 1);

    // Color: when settled → warm gold, when energetic → bright/cool
    const energy = Math.min(1, dist * 1.5 + Math.abs(p.vx) + Math.abs(p.vy));
    totalEnergy += energy;

    const hue = 0.08 - energy * 0.04;
    const sat = 0.3 + energy * 0.2;
    const light = 0.7 + energy * 0.25;
    p.sprite.material.color.setHSL(hue, sat, light);

    // Opacity fade on z
    const zDepth = Math.abs(p.z);
    p.sprite.material.opacity = Math.min(1, 1 - zDepth * 0.03);
  }

  // Auto-return detection
  if (isExploded) {
    const avgEnergy = totalEnergy / charParticles.length;
    if (avgEnergy < 0.08) {
      isExploded = false;
      // Reset colors to warm gold
      for (const p of charParticles) {
        p.sprite.material.color.setHSL(0.08, 0.3, 0.72);
        p.sprite.material.opacity = 1;
      }
    }
  }

  // Auto-explode timer
  const elapsed = clock.getElapsedTime();
  if (!isExploded && elapsed - lastAutoExplode > autoExplodeInterval) {
    explodeRandom();
  }

  // Return total energy for bloom modulation
  return totalEnergy / charParticles.length;
}

// ═══════════════════════════════════════════════════════
//  SETUP
// ═══════════════════════════════════════════════════════

async function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050508);
  scene.fog = new THREE.FogExp2(0x050508, 0.004);

  camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
  camera.position.set(3, 1.5, 4);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.9;
  document.body.appendChild(renderer.domElement);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.1, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.0;
  controls.minDistance = 1.5;
  controls.maxDistance = 12;
  controls.update();

  // Bloom
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(innerWidth, innerHeight),
    0.4, 0.15, 0.1
  );
  composer.addPass(bloom);
  // Store reference for dynamic adjustment
  composer.bloomPass = bloom;

  // Wait for fonts
  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 100));

  // Layout text with Pretext
  charParticles = layoutText();
  centerParticles(charParticles);

  // Build scene
  buildScene();
  buildStars();

  // Lighting (subtle — sprites are self-illuminated)
  const ambient = new THREE.AmbientLight(0x111122, 0.2);
  scene.add(ambient);

  // Hide loading
  document.getElementById('loading').classList.add('hidden');

  // Click handler
  renderer.domElement.addEventListener('click', (e) => {
    // Convert mouse to 3D position at z=0 plane
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    // Find intersection with z=0 plane
    const planeNormal = new THREE.Vector3(0, 0, 1);
    const planePoint = new THREE.Vector3(0, 0, 0);
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(planeNormal, planePoint);
    const intersect = new THREE.Vector3();
    raycaster.ray.intersectPlane(plane, intersect);

    if (intersect) {
      explode(intersect.x, intersect.y);
    }
  });

  // Start
  lastAutoExplode = clock.getElapsedTime();
  animate();
}

// ═══════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════

function animate() {
  const elapsed = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.05);
  // Actually use elapsed for physics to avoid dt issues
  const _dt = 0.016;

  // Update particle physics
  const avgEnergy = updateParticles(elapsed, _dt);

  // Modulate bloom based on energy
  if (composer.bloomPass) {
    const bloomStrength = 0.25 + avgEnergy * 1.8;
    composer.bloomPass.strength = Math.min(bloomStrength, 2.0);
  }

  // Star twinkle
  if (starField) {
    starField.material.opacity = 0.5 + Math.sin(elapsed * 0.12) * 0.1;
  }

  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}

// ═══════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

window.addEventListener('keydown', (e) => {
  if (e.key === 's' || e.key === 'S') {
    renderer.render(scene, camera);
    const link = document.createElement('a');
    link.download = '文字爆炸.png';
    link.href = renderer.domElement.toDataURL('image/png');
    link.click();
  }
  if (e.key === ' ') {
    e.preventDefault();
    explodeRandom();
  }
});

// GO!
init().catch(console.error);
</script>
</body>
</html>
