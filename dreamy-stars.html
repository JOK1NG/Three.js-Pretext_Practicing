<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夢幻星空</title>
  <script>p5.disableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #050510; }
    canvas { display: block; }
    #info {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.25); font: 13px/1.4 'Helvetica Neue', sans-serif;
      text-align: center; pointer-events: none; user-select: none;
      letter-spacing: 0.5px;
    }
    #info kbd {
      display: inline-block; padding: 0 6px; margin: 0 2px;
      background: rgba(255,255,255,0.08); border-radius: 3px;
      font-family: inherit;
    }
  </style>
</head>
<body>
<div id="info">按 <kbd>s</kbd> 存圖 · <kbd>g</kbd> 存 GIF · 點擊滑鼠吸引粒子</div>
<script>
// ═══════════════════════════════════════════════════════
//  DREAMY STARFIELD · 夢幻星空
//  A deep generative cosmos with layers of stars,
//  drifting nebula, luminous particles, and shooting stars.
// ═══════════════════════════════════════════════════════

const CONFIG = {
  starCount: 1000,
  particleCount: 70,
  shootingStarChance: 0.004,
  nebulaSpeed: 0.00006,
};

// HSB nebula palettes — soft, dreamy
const NEBULAE = [
  { h: 260, s: 50, b: 14 },
  { h: 210, s: 40, b: 12 },
  { h: 330, s: 35, b: 10 },
];

// HSB particle colors — warm jewels against dark space
const PARTICLE_COLORS = [
  { h: 42,  s: 85, b: 100 },  // gold
  { h: 190, s: 70, b: 100 },  // cyan
  { h: 310, s: 60, b: 100 },  // magenta
  { h: 80,  s: 50, b: 100 },  // lime
  { h: 0,   s: 0,  b: 100 },  // white
];

// ── State ──
let stars = [];
let particles = [];
let shootingStars = [];
let bgGradient;
let time = 0;
let mouseAttract = false;

// ═══════════════════════════════════════════════════════
//  STAR — three depth layers with natural twinkle
// ═══════════════════════════════════════════════════════
class Star {
  constructor() {
    this.x = random(width);
    this.y = random(height);
    this.z = random();                // 0..1 depth
    this.size = map(this.z, 0, 1, 0.4, 3.2);
    this.baseBright = random(160, 255);
    this.twinkleSpeed = random(0.8, 3.5);
    this.twinklePhase = random(TWO_PI);
    // Warmth skew: deep stars (small) are cool-blue, near stars are warm-white
    this.warmth = map(this.z, 0, 1, 0.3, 1);
    this.glow = this.z > 0.6;        // only brighter stars glow
  }

  display() {
    // Parallax from mouse (subtle — stars don't move much)
    let px = this.x;
    let py = this.y;
    if (mouseX > 0 && mouseY > 0) {
      let pull = this.z * 0.05;
      px += (mouseX - width / 2) * pull;
      py += (mouseY - height / 2) * pull;
    }

    // Twinkle
    let t = sin(time * this.twinkleSpeed + this.twinklePhase) * 0.35 + 0.65;
    let bright = this.baseBright * t;
    let s = this.size * (0.7 + t * 0.5);

    // Glow halo for brighter stars
    if (this.glow && t > 0.5) {
      let gAlpha = bright * t * 0.12;
      colorMode(HSB, 360, 100, 100, 100);
      noStroke();
      fill(45, this.warmth * 20, min(100, bright * 1.2), gAlpha);
      ellipse(px, py, s * 7);
      colorMode(RGB, 255);
    }

    // Star body — warm-to-cool blend
    let r = lerp(180, 255, this.warmth);
    let g = lerp(200, 248, this.warmth);
    let b = lerp(255, 235, this.warmth);
    noStroke();
    fill(r, g, b, bright);
    ellipse(px, py, s);
  }
}

// ═══════════════════════════════════════════════════════
//  DRIFTING PARTICLE — noise-guided, trailing, luminous
// ═══════════════════════════════════════════════════════
class Particle {
  constructor() {
    this.reset();
  }

  reset() {
    this.x = random(width);
    this.y = random(height);
    this.vx = 0;
    this.vy = 0;
    this.noiseSeedX = random(10000);
    this.noiseSeedY = random(10000);
    this.size = random(2.5, 6);
    this.baseAlpha = random(40, 90);
    this.alpha = this.baseAlpha;
    this.col = random(PARTICLE_COLORS);
    this.life = random(400, 1000);
    this.maxLife = this.life;
    this.trail = [];
    this.maxTrail = floor(random(8, 22));
    this.phase = random(TWO_PI);
  }

  update() {
    let nx = this.x * 0.002 + this.noiseSeedX + time * 0.0004;
    let ny = this.y * 0.002 + this.noiseSeedY + time * 0.0006;
    let angle = noise(nx, ny) * TWO_PI * 2.5;
    let speed = map(this.size, 2.5, 6, 0.12, 0.35);

    this.vx += cos(angle) * speed * 0.04;
    this.vy += sin(angle) * speed * 0.04;
    this.vx *= 0.97;
    this.vy *= 0.97;

    // Mouse attract on click — gentle vortex
    if (mouseAttract && mouseIsPressed) {
      let dx = mouseX - this.x;
      let dy = mouseY - this.y;
      let d = sqrt(dx * dx + dy * dy);
      if (d < 250 && d > 5) {
        this.vx += (dx / d) * 0.25;
        this.vy += (dy / d) * 0.25;
      }
    }

    this.x += this.vx;
    this.y += this.vy;

    // Trail
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();

    // Life
    this.life--;
    this.alpha = map(this.life, 0, this.maxLife, 0, this.baseAlpha);

    // Wrap
    if (this.x < -60) this.x = width + 60;
    if (this.x > width + 60) this.x = -60;
    if (this.y < -60) this.y = height + 60;
    if (this.y > height + 60) this.y = -60;

    if (this.life <= 0) this.reset();
  }

  display() {
    colorMode(HSB, 360, 100, 100, 100);

    // Trail — fades and shrinks
    for (let i = 0; i < this.trail.length; i++) {
      let p = i / this.trail.length;
      let a = this.alpha * p * 0.25;
      let s = this.size * p * 0.5;
      fill(this.col.h, this.col.s, this.col.b, a);
      noStroke();
      ellipse(this.trail[i].x, this.trail[i].y, s);
    }

    // Outer glow
    fill(this.col.h, this.col.s, this.col.b, this.alpha * 0.18);
    noStroke();
    ellipse(this.x, this.y, this.size * 6);

    // Core
    fill(this.col.h, this.col.s, this.col.b, this.alpha);
    ellipse(this.x, this.y, this.size);

    colorMode(RGB, 255);
  }
}

// ═══════════════════════════════════════════════════════
//  SHOOTING STAR — bright streak that fades
// ═══════════════════════════════════════════════════════
class ShootingStar {
  constructor() {
    this.x = random(-100, -20);
    this.y = random(-50, height * 0.35);
    let angle = random(PI / 4.5, PI / 2.8);
    let speed = random(10, 22);
    this.vx = cos(angle) * speed;
    this.vy = sin(angle) * speed;
    this.life = random(30, 70);
    this.maxLife = this.life;
    this.trail = [];
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 25) this.trail.shift();
  }

  display() {
    let fade = map(this.life, 0, this.maxLife, 0, 1);
    let headAlpha = fade * 255;
    let len = this.trail.length;

    // Trail segments
    for (let i = 1; i < len; i++) {
      let p = i / len;
      let a = headAlpha * p * 0.5;
      let w = map(i, 0, len - 1, 0.3, 2.5);
      stroke(255, 255, 255, a);
      strokeWeight(w);
      line(this.trail[i - 1].x, this.trail[i - 1].y, this.trail[i].x, this.trail[i].y);
    }

    // Head glow
    noStroke();
    fill(255, 255, 255, headAlpha * 0.15);
    ellipse(this.x, this.y, 18);
    fill(255, 255, 240, headAlpha * 0.4);
    ellipse(this.x, this.y, 8);
    fill(255, 255, 255, headAlpha);
    ellipse(this.x, this.y, 2.5);
  }

  isDead() {
    return this.life <= 0 || this.x > width + 120 || this.y > height + 120;
  }
}

// ═══════════════════════════════════════════════════════
//  SETUP
// ═══════════════════════════════════════════════════════
function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  colorMode(RGB, 255);
  let s = floor(random(99999));
  randomSeed(s);
  noiseSeed(s);

  // Space background gradient (precompute)
  bgGradient = createGraphics(width, height);
  bgGradient.colorMode(RGB, 255);
  for (let y = 0; y < height; y++) {
    let t = y / height;
    let r = lerp(6, 12, t);
    let g = lerp(6, 8, t);
    let b = lerp(20, 35, t);
    bgGradient.stroke(r, g, b);
    bgGradient.line(0, y, width, y);
  }

  // Stars
  for (let i = 0; i < CONFIG.starCount; i++) stars.push(new Star());

  // Particles
  for (let i = 0; i < CONFIG.particleCount; i++) particles.push(new Particle());
}

// ═══════════════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════════════
function draw() {
  time = frameCount * 0.01;

  // ── Background ──
  image(bgGradient, 0, 0);

  // ── Nebula ──
  drawNebula();

  // ── Shooting stars ──
  if (random() < CONFIG.shootingStarChance) {
    shootingStars.push(new ShootingStar());
  }
  shootingStars = shootingStars.filter(s => !s.isDead());
  for (let s of shootingStars) s.update();
  for (let s of shootingStars) s.display();

  // ── Stars ──
  for (let star of stars) star.display();

  // ── Particles ──
  for (let p of particles) p.update();
  for (let p of particles) p.display();
}

// ═══════════════════════════════════════════════════════
//  NEBULA — soft drifting clouds via layered noise
// ═══════════════════════════════════════════════════════
let nebulaTime = 0;

function drawNebula() {
  nebulaTime += CONFIG.nebulaSpeed;
  colorMode(HSB, 360, 100, 100, 100);
  noStroke();

  for (let n of NEBULAE) {
    for (let i = 0; i < 3; i++) {
      let cx = noise(nebulaTime + i * 8.3) * width;
      let cy = noise(nebulaTime + i * 8.3 + 100) * height;
      let r = (noise(nebulaTime + i * 8.3 + 200) * 0.3 + 0.15) * width;

      // Draw as concentric rings for soft falloff
      for (let rad = r; rad > 0; rad -= 6) {
        let a = map(rad, 0, r, 0, 2.5);
        fill(n.h, n.s, n.b, a);
        ellipse(cx, cy, rad * 2);
      }
    }
  }

  colorMode(RGB, 255);
}

// ═══════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════
function mousePressed() { mouseAttract = true; }
function mouseReleased() { mouseAttract = false; }

function keyPressed() {
  if (key === 's' || key === 'S') saveCanvas('dreamy-stars', 'png');
  if (key === 'g' || key === 'G') saveGif('dreamy-stars', 4);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  // Rebuild background gradient
  bgGradient = createGraphics(width, height);
  bgGradient.colorMode(RGB, 255);
  for (let y = 0; y < height; y++) {
    let t = y / height;
    bgGradient.stroke(lerp(6, 12, t), lerp(6, 8, t), lerp(20, 35, t));
    bgGradient.line(0, y, width, y);
  }
}
</script>
</body>
</html>
