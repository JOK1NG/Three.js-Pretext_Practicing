<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第三阶段 · 太阳系</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000011; overflow: hidden; }
  canvas { display: block; }
  #hint {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.3); font-size: 13px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="hint">左键旋转 · 滚轮缩放 · 右键平移</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ----- 场景 -----
const scene = new THREE.Scene();
scene.background = new THREE.Color('#000011');

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 15, 25);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 60;
controls.update();

// ----- 星空背景 -----
const starsGeo = new THREE.BufferGeometry();
const starCount = 1500;
const pos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  pos[i * 3] = (Math.random() - 0.5) * 100;
  pos[i * 3 + 1] = (Math.random() - 0.5) * 100;
  pos[i * 3 + 2] = (Math.random() - 0.5) * 100;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({
  color: '#ffffff', size: 0.08, transparent: true, opacity: 0.7,
}));
scene.add(stars);

// ----- 太阳（纹理贴图）-----
const sunGeo = new THREE.SphereGeometry(1.2, 48, 48);
const sunMat = new THREE.MeshBasicMaterial({ color: '#ff8800', toneMapped: false }); // 加载中临时颜色
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);

const img = new Image();
img.onload = () => {
  const canvas = document.createElement('canvas');
  canvas.width = 2048;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  // 原图是“太阳圆盘 + 黑色背景”，直接整张贴到球体会把黑色背景也贴上去。
  // 裁出圆盘中央的太阳表面区域，再拉成球面贴图需要的 2:1 比例。
  const cropSize = Math.floor(Math.min(img.width, img.height) * 0.6);
  const sx = (img.width - cropSize) / 2;
  const sy = (img.height - cropSize) / 2;
  ctx.drawImage(img, sx, sy, cropSize, cropSize, 0, 0, canvas.width, canvas.height);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  sun.material.map = tex;
  sun.material.color.set('#ffffff');
  sun.material.toneMapped = false;
  sun.material.needsUpdate = true;
  console.log('纹理加载成功，已裁掉原图黑边并铺满 2048×1024');
};
img.onerror = (e) => console.error('图片加载失败', e);
img.crossOrigin = 'anonymous';
img.src = './sun_nasa_4k.jpg';

// 太阳光
const sunLight = new THREE.PointLight('#fff8e0', 80, 60);
scene.add(sunLight);

// 环境光（让行星暗面不完全黑）
scene.add(new THREE.AmbientLight('#101030', 0.4));

// ============================================================
// 行星数据：[名字, 轨道半径, 大小, 颜色, 公转速度, 自转速度]
// ============================================================
const planetData = [
  { name: '水星', orbit: 2.5, size: 0.18, color: '#b0b0b0', speed: 2.0, selfSpin: 0.03 },
  { name: '金星', orbit: 4.0, size: 0.35, color: '#e8cda0', speed: 1.4, selfSpin: 0.02 },
  { name: '地球', orbit: 5.8, size: 0.38, color: '#4488cc', speed: 1.0, selfSpin: 0.04 },
  { name: '火星', orbit: 7.5, size: 0.28, color: '#cc5533', speed: 0.7, selfSpin: 0.035 },
  { name: '木星', orbit: 10.5, size: 0.85, color: '#d4b896', speed: 0.4, selfSpin: 0.06 },
];

const planets = [];

planetData.forEach((p) => {
  // 行星本体
  const geo = new THREE.SphereGeometry(p.size, 32, 16);
  const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.6, metalness: 0.1 });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  // 轨道线
  const orbitPts = [];
  for (let i = 0; i <= 128; i++) {
    const angle = (i / 128) * Math.PI * 2;
    orbitPts.push(new THREE.Vector3(Math.cos(angle) * p.orbit, 0, Math.sin(angle) * p.orbit));
  }
  const orbitLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(orbitPts),
    new THREE.LineBasicMaterial({ color: '#333355', transparent: true, opacity: 0.5 }),
  );
  scene.add(orbitLine);

  planets.push({ mesh, orbit: p.orbit, speed: p.speed, selfSpin: p.selfSpin, angle: Math.random() * Math.PI * 2 });
});

//定义月球
const moonGeo = new THREE.SphereGeometry(0.1, 16, 16);
const moon = new THREE.Mesh(moonGeo, new THREE.MeshStandardMaterial({ color: '#c8c8c8', roughness: 0.6, metalness: 0.0 }));
scene.add(moon);

let moonAngle = 0;//月球绕地球的角度

// ============================================================
// 动画 — 核心：用角度 + sin/cos 算位置
// ============================================================
//   x = cos(angle) * 轨道半径
//   z = sin(angle) * 轨道半径
//   angle 每帧加上 speed，行星就沿轨道转圈
// ============================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = clock.getDelta();
  sun.rotation.y += dt * 0.2;  // 太阳自转

  planets.forEach((p) => {
    p.angle += dt * p.speed;  // 公转
    p.mesh.position.x = Math.cos(p.angle) * p.orbit;
    p.mesh.position.z = Math.sin(p.angle) * p.orbit;
    p.mesh.rotation.y += dt * p.selfSpin;  // 自转
  });

  moonAngle += dt * 4.0; // 月球绕地球公转
  const earth = planets[2];
  moon.position.x = earth.mesh.position.x + Math.cos(moonAngle) * 0.9;
  moon.position.z = earth.mesh.position.z + Math.sin(moonAngle) * 0.9;

  controls.update();
  renderer.render(scene, camera);
}
animate();

// ----- 窗口自适应 -----
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
