<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>着色器测试</title>
</head>
<style>
    * { margin: 0; padding: 0; }
    body { background: #0a0a1a; overflow: hidden; }
    canvas { display: block; }
</style>
<body>
    
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 场景
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a0a1a');

// 相机
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 3);
camera.lookAt(0, 0, 0);

// 渲染器
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 控制
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

// 灯光
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
directionalLight.position.set(5, 10, 5);
scene.add(directionalLight);

// 顶点着色器：决定方块每个顶点的位置
const vertexShader = `
  varying vec2 vUv;
  
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

// 片元着色器：决定每个像素的颜色
const fragmentShader = `
  uniform float uTime;  // 从 JS 传来的时间
  varying vec2 vUv;
  
  void main() {
    // 用 sin(time + 位置) 做颜色变化
    float r = sin(vUv.x * 3.14 + uTime) * 0.5 + 0.5;
    float g = sin(vUv.y * 3.14 + uTime * 1.3) * 0.5 + 0.5;
    float b = sin((vUv.x + vUv.y) * 3.14 + uTime * 0.7) * 0.5 + 0.5;
    gl_FragColor = vec4(r, g, b, 1.0);
  }
`;

// 创建材质
const shaderMaterial = new THREE.ShaderMaterial({
  vertexShader: vertexShader,
  fragmentShader: fragmentShader,
  uniforms: {
    uTime: { value: 0.0 },  // 初始时间
  },
});

// 创建方块
const geo = new THREE.BoxGeometry(1, 1, 1);
const mesh = new THREE.Mesh(geo, shaderMaterial);
scene.add(mesh);

// 渲染循环
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    
    // 更新时间
    shaderMaterial.uniforms.uTime.value = performance.now() * 0.001;
    
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
