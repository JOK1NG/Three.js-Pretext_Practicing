<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第八阶段 · 文字瀑布</title>
</head>
<style>
    * { margin: 0; padding: 0; }
    body { background: #FFFFFF; overflow: hidden; }
    canvas { display: block; }
</style>
<body>
    
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { prepareWithSegments, walkLineRanges, materializeLineRange } from 'https://esm.sh/@chenglou/pretext@0.0.6';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

//准备pretext诗词和字体
const TEXT = [
  '春江潮水连海平，海上明月共潮生。',
  '滟滟随波千万里，何处春江无月明。',
  '江流宛转绕芳甸，月照花林皆似霰。',
].join('\n');
const FONT = '24px "Songti SC", "Noto Serif CJK SC", serif';
const COL_W = 400;  // 排版宽度
const LINE_H = 40;  // 行高

//用pretex排版和拆成独立字符
function layoutChars() {
    const prepared = prepareWithSegments(TEXT, FONT);
    const chars = [];

    // 临时 canvas 用来测量字符宽度
    const tmp = document.createElement('canvas');
    const tctx = tmp.getContext('2d');
    tctx.font = FONT;

    let lineY = 0;

    // walkLineRanges 会逐行遍历排版结果
    walkLineRanges(prepared, COL_W, (line) => {
      const range = materializeLineRange(prepared,   line);

      if (!range.text.trim()) {
      lineY += LINE_H;
      return;
    }

    let lineX = 0;

    // 用 Intl.Segmenter 把一行拆成单个字符
    const seg = new Intl.Segmenter(undefined, { granularity: 'grapheme' });

    for (const { segment } of seg.segment(range.text)) {
      if (segment.trim() === '') {
        lineX += tctx.measureText(segment).width || 8;
        continue;
      }

      const w = tctx.measureText(segment).width || 20;

      chars.push({
        char: segment,
        x: lineX + w / 2,
        y: lineY,
        width: w,
      });

      lineX += w;
    }

    lineY += LINE_H;
  });

  return chars;
}
const chars = layoutChars();
console.log(chars);  // 看看拆出来的字符长什么样

// 场景
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a0a1a');

// 相机
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 5);
camera.lookAt(0, 0, 0);

// 渲染器
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 控制
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();
//构建PlaneGeometry
const geometry = new THREE.PlaneGeometry(10, 10, 4, 4);
const positions = geometry.attributes.position;
for (let i = 0; i < positions.count; i++) {
  const x = positions.getX(i);  // 读取 x
  const y = positions.getY(i);  // 读取 y
  const z = positions.getZ(i);  // 读取 z（现在是 0）
  // 用 sin/cos 生成一个"波浪"高度
  const height = Math.sin(x * 0.5) * Math.cos(y * 0.3) * 1.5;
  positions.setZ(i, height);  // 把 z 改成这个高度
}
geometry.computeVertexNormals();
//灯光
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
directionalLight.position.set(5, 10, 5);
scene.add(directionalLight);
// PlaneGeometry 默认朝上（面向 z 轴正方向）
// 但我们的场景里，"上"是 y 轴
// 所以要旋转一下，让它变成水平的地面
const material = new THREE.MeshStandardMaterial({
  color: 0xD8FFEF,      // 浅绿色，像山丘
  wireframe: false,      // 先用实体看效果
  flatShading: true,     // 用平面着色，能看到每个三角面，更有地形感
});
const terrain = new THREE.Mesh(geometry, material);
terrain.rotation.x = -Math.PI / 2;  // 旋转 90 度，让它变成水平的
scene.add(terrain);

// 后期处理
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.2,  // strength 强度
  0.3,  // radius 半径
  0.5   // threshold 阈值
);
composer.addPass(bloomPass);

// 创建字符精灵的函数
function createCharMesh(char, x, y) {
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  
  ctx.clearRect(0, 0, 64, 64);
  
  // 光晕效果
  ctx.shadowColor = 'rgba(255, 150, 50, 0.8)';
  ctx.shadowBlur = 15;
  
  // 渐变色
  const gradient = ctx.createLinearGradient(0, 0, 0, 64);
  gradient.addColorStop(0, '#ffd700');
  gradient.addColorStop(1, '#ff6644');
  ctx.fillStyle = gradient;
  
  // 字体
  ctx.font = '48px "Georgia", "Songti SC", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  // 先画描边
  ctx.strokeStyle = '#ff6644';
  ctx.lineWidth = 2;
  ctx.strokeText(char, 32, 32);
  
  // 再画填充
  ctx.fillText(char, 32, 32);
  
  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ 
    map: texture,
    transparent: true,
  });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(0.5, 0.5, 1);
  
  sprite.position.set(x * 0.05 - 2, 15, y * 0.05 - 2);
  
  return sprite;
}

// 批量创建所有字符方块
const charMeshes = [];
let charIndex = 0;

function spawnChar() {
  // 每次创建 3 个字符
  for (let i = 0; i < 3; i++) {
    const c = chars[charIndex % chars.length];
    const mesh = createCharMesh(c.char, c.x, c.y);
    scene.add(mesh);
    charMeshes.push({
      mesh: mesh,
      velocity: 0,
      char: c.char,
      vx: (Math.random() - 0.5) * 0.15,
      vz: (Math.random() - 0.5) * 0.15,
      life: 1.0,           // 生命值
      isLanded: false,      // 是否已落地
    });
    charIndex++;
  }
}

// 每 50 毫秒创建一批（3 个）
setInterval(spawnChar, 50);
// 物理变量
const gravity = -0.005;
const raycaster = new THREE.Raycaster();
const down = new THREE.Vector3(0, -1, 0);

// 四个角相对于中心的偏移
const halfSize = 0.1;
const corners = [
    new THREE.Vector3(-halfSize, 0, -halfSize),
    new THREE.Vector3( halfSize, 0, -halfSize),
    new THREE.Vector3(-halfSize, 0,  halfSize),
    new THREE.Vector3( halfSize, 0,  halfSize),
];

// 渲染循环
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    
    // 让所有字符方块掉落
    for (const item of charMeshes) {
        item.velocity += gravity;
        item.mesh.position.y += item.velocity;
        item.mesh.position.x += item.vx;
        item.mesh.position.z += item.vz;
        
        // 拖尾效果：10% 概率创建残影，且总数 < 200
        if (Math.random() < 0.1 && charMeshes.length < 200) {
            const trail = item.mesh.clone();
            trail.material = item.mesh.material.clone();
            trail.material.opacity = 0.3;
            trail.scale.multiplyScalar(0.8);
            scene.add(trail);
            
            // 残影 150ms 后消失
            setTimeout(() => {
                scene.remove(trail);
                trail.material.dispose();
                trail.material.map.dispose();
            }, 150);
        }
        
        // 四条射线碰撞检测
        let maxHitY = -Infinity;
        for (const corner of corners) {
            const origin = item.mesh.position.clone().add(corner);
            raycaster.set(origin, down);
            const intersects = raycaster.intersectObject(terrain);
            if (intersects.length > 0) {
                const hitY = intersects[0].point.y;
                if (hitY > maxHitY) {
                    maxHitY = hitY;
                }
            }
        }
        
        // 落到地形上
        if (maxHitY > -Infinity) {
            if (item.mesh.position.y < maxHitY + 0.1) {
                item.mesh.position.y = maxHitY + 0.1;
                item.velocity = -item.velocity * 0.3;
                item.isLanded = true;  // 标记已落地
            }
        }
        
        // 如果已落地，生命值减少
        if (item.isLanded) {
            item.life -= 0.005;  // 每帧减少 0.005
            item.mesh.material.opacity = item.life;  // 更新透明度
        }
        
        // 如果生命值 <= 0，移除字符
        if (item.life <= 0) {
            scene.remove(item.mesh);
            item.mesh.material.dispose();
            item.mesh.material.map.dispose();
        }
    }
    
    // 清理已移除的字符
    for (let i = charMeshes.length - 1; i >= 0; i--) {
        if (charMeshes[i].life <= 0) {
            charMeshes.splice(i, 1);
        }
    }
    
    composer.render();
}
animate();
</script>
</body>
</html>
