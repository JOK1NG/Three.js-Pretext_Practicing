<!DOCTYPE html>
<html>
<head><style>body{margin:0} canvas{display:block}</style></head>
<body>
<canvas id="c" width="600" height="600"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { premultipliedAlpha: false });

// ===== 顶点着色器：现在先不用管它 =====
const vsSource = `
  attribute vec2 aPos;
  void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

// ===== 片元着色器：我们的主战场！=====
const fsSource = `
  precision mediump float;
  uniform vec2 uResolution;
  uniform float uTime;          // 👈 新增：当前时间（秒）

  void main() {
    vec2 uv = (gl_FragCoord.xy * 2.0 - uResolution) / uResolution.y;
    vec2 center = vec2(sin(uTime) * 0.5, cos(uTime) * 0.5);
    float radius = 0.3 + 0.2 * sin(uTime);
    float softness = 0.01;
    float d = length(uv - center);
    float circle = 1.0 - smoothstep(radius - softness * 0.5, radius + softness * 0.5, d);
    vec3 color = vec3(
      sin(uTime) * 0.5 + 0.5,            // R：0~1 来回
      sin(uTime * 1.3) * 0.5 + 0.5,      // G：用不同速度，产生相位差
      sin(uTime * 1.7) * 0.5 + 0.5       // B：又一个速度
    );
    gl_FragColor = vec4(color * circle, 1.0);
  }
`;

// ===== 下面这段是固定模板，先不用看懂 =====
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSource));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSource));
gl.linkProgram(prog); gl.useProgram(prog);
const uResLoc = gl.getUniformLocation(prog, 'uResolution');
gl.uniform2f(uResLoc, canvas.width, canvas.height);
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uTimeLoc = gl.getUniformLocation(prog, 'uTime');

function frame(t) {
  gl.uniform1f(uTimeLoc, t * 0.001);   // t 是毫秒，除以 1000 变成秒
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);         // 下一帧再来一次
}
requestAnimationFrame(frame);
</script>
</body>
</html>
