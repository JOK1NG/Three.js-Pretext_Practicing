<!DOCTYPE html>
<html>
<head><style>body{margin:0} canvas{display:block}</style></head>
<body>
<canvas id="c" width="800" height="400"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { premultipliedAlpha: false });

// ===== 顶点着色器：现在先不用管它 =====
const vsSource = `
  attribute vec2 aPos;
  void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

// ===== 片元着色器：我们的主战场！=====
const fsSource = `
  precision mediump float;
  uniform vec2 uResolution;   // 👈 新增：从 JS 传进来的画布尺寸

  void main() {
    vec2 uv = gl_FragCoord.xy / uResolution;   // 👈 用 uniform 而不是写死 600.0
    gl_FragColor = vec4(uv.x, uv.y, 0.0, 1.0);
  }
`;

// ===== 下面这段是固定模板，先不用看懂 =====
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSource));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSource));
gl.linkProgram(prog); gl.useProgram(prog);
const uResLoc = gl.getUniformLocation(prog, 'uResolution');
gl.uniform2f(uResLoc, canvas.width, canvas.height);
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
</script>
</body>
</html>
